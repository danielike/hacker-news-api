name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: HackerNewsApi.exe
          - rid: linux-x64
            asset: HackerNewsApi
          - rid: osx-arm64
            asset: HackerNewsApi-macos-arm64
          - rid: osx-x64
            asset: HackerNewsApi-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file executable
        run: >
          dotnet publish HackerNewsApi.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Create release and upload executable
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/${{ matrix.asset }}
          generate_release_notes: true
